<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 600px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            border-color: #0066cc;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #004c99;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f8f8f8;
            text-align: center;
            border-radius: 8px;
        }

        .result h2 {
            margin-bottom: 25px;
        }

        .result p {
            font-size: 18px;
            margin: 15px;
        }

        .result span {
            font-weight: normal;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Grade Calculator</h1>

    <!-- Student Name -->
    <input type="text" id="name"
           placeholder="Enter Student Name">

    <!-- Subject Marks -->
    <input type="number" id="sub1"
           placeholder="Enter Subject 1 Marks">

    <input type="number" id="sub2"
           placeholder="Enter Subject 2 Marks">

    <input type="number" id="sub3"
           placeholder="Enter Subject 3 Marks">

    <input type="number" id="sub4"
           placeholder="Enter Subject 4 Marks">

    <input type="number" id="sub5"
           placeholder="Enter Subject 5 Marks">

    <button onclick="calculateResult()">
        Calculate Result
    </button>

    <!-- Result -->
    <div class="result" id="result">
        <h2>Result</h2>

        <p>
            <b>Student Name:</b>
            <span id="studentName">-</span>
        </p>

        <p>
            <b>Total Marks:</b>
            <span id="total">-</span>
        </p>

        <p>
            <b>Percentage:</b>
            <span id="percentage">-</span>
        </p>

        <p>
            <b>Grade:</b>
            <span id="grade">-</span>
        </p>
    </div>

</div>


<script>

function calculateResult() {

    // Get student name
    let name = document.getElementById("name").value;

    // Get marks
    let m1 = Number(document.getElementById("sub1").value);
    let m2 = Number(document.getElementById("sub2").value);
    let m3 = Number(document.getElementById("sub3").value);
    let m4 = Number(document.getElementById("sub4").value);
    let m5 = Number(document.getElementById("sub5").value);

    // Calculate total
    let total = m1 + m2 + m3 + m4 + m5;

    // Calculate percentage
    let percentage = (total / 500) * 100;

    // Calculate grade
    let grade;

    if (percentage >= 90) {
        grade = "A+";
    }
    else if (percentage >= 80) {
        grade = "A";
    }
    else if (percentage >= 70) {
        grade = "B";
    }
    else if (percentage >= 60) {
        grade = "C";
    }
    else if (percentage >= 50) {
        grade = "D";
    }
    else {
        grade = "F";
    }

    // Display result
    document.getElementById("studentName").innerHTML = name;
    document.getElementById("total").innerHTML =
        total + " / 500";
    document.getElementById("percentage").innerHTML =
        percentage.toFixed(2) + "%";
    document.getElementById("grade").innerHTML = grade;
}

</script>

</body>
</html>
